spring:
  application:
    name: ms-notificaciones
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uber}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

externo:
  telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
  telegram-base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
  groq-api-key: ${GROQ_API_KEY:}
  groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
  usuarios-url: ${USUARIOS_URL:}

telegram:
  polling:
    intervalo-ms: ${TELEGRAM_POLLING_MS:3000}
