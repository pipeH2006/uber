spring:
  application:
    name: ms-viajes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uber}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

externo:
  osrm-base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
  dolar-base-url: ${DOLAR_BASE_URL:https://open.er-api.com}
  notificaciones-url: ${NOTIFICACIONES_URL:}
  usuarios-url: ${USUARIOS_URL:}
