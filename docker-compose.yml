services:
  postgres:
    image: postgres:16-alpine
    container_name: uber-postgres
    environment:
      POSTGRES_DB: uber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms-usuarios
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/uber
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  ms-viajes:
    build: ./ms-viajes
    container_name: ms-viajes
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/uber
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: "8082"
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      NOTIFICACIONES_URL: http://ms-notificaciones:8084
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      ms-notificaciones:
        condition: service_started

  ms-pagos:
    build: ./ms-pagos
    container_name: ms-pagos
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/uber
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: "8083"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NOTIFICACIONES_URL: http://ms-notificaciones:8084
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      ms-notificaciones:
        condition: service_started

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: ms-notificaciones
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/uber
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: "8084"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
