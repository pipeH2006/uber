spring:
  application:
    name: ms-pagos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uber}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

externo:
  dolar-base-url: ${EXTERNO_DOLAR_BASE_URL:https://open.er-api.com}
  groq-api-key: ${GROQ_API_KEY:}
  groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
  notificaciones-url: ${NOTIFICACIONES_URL:}
