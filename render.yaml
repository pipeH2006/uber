# Render Blueprint: despliega los 4 microservicios. La base PostgreSQL es UNA sola,
# compartida y alojada en Neon (https://neon.com), no en Render.
#
# DB_URL no está en este archivo (sync: false): Render la pide al crear el Blueprint.
# Pega la misma cadena de Neon (Connect > Pooled connection) en los 4 servicios, p. ej.:
#   postgresql://USUARIO:CLAVE@ep-xxxx-pooler.REGION.aws.neon.tech/neondb?sslmode=require
#
# No hay conflicto de tablas: cada microservicio usa nombres distintos
# (usuarios, calificaciones, viajes, pagos, notificaciones, plantillas).
#
# En LOCAL (docker-compose.yml) se usa UNA sola base `uber` en Docker, compartida por los 4 servicios.

services:
  - type: web
    name: uber-ms-usuarios
    runtime: docker
    dockerfilePath: ./ms-usuarios/Dockerfile
    dockerContext: ./ms-usuarios
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false

  - type: web
    name: uber-ms-viajes
    runtime: docker
    dockerfilePath: ./ms-viajes/Dockerfile
    dockerContext: ./ms-viajes
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: OSRM_BASE_URL
        value: "https://router.project-osrm.org"
      - key: NOTIFICACIONES_URL
        value: "https://uber-ms-notificaciones.onrender.com"
      - key: USUARIOS_URL
        value: "https://uber-ms-usuarios.onrender.com"

  - type: web
    name: uber-ms-pagos
    runtime: docker
    dockerfilePath: ./ms-pagos/Dockerfile
    dockerContext: ./ms-pagos
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NOTIFICACIONES_URL
        value: "https://uber-ms-notificaciones.onrender.com"
      - key: USUARIOS_URL
        value: "https://uber-ms-usuarios.onrender.com"

  - type: web
    name: uber-ms-notificaciones
    runtime: docker
    dockerfilePath: ./ms-notificaciones/Dockerfile
    dockerContext: ./ms-notificaciones
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: USUARIOS_URL
        value: "https://uber-ms-usuarios.onrender.com"
