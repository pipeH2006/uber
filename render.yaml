# Render Blueprint: despliega los 4 microservicios + 4 bases PostgreSQL.
#
# IMPORTANTE:
#   - Despliega cada microservicio por separado (mejor que el bloque completo).
#   - La URL de la BD que inyecta Render (postgres://...) la convierte
#     DatabaseUrlConfig (infrastructure/config) a una URL JDBC automáticamente.
#   - Las claves secretas se piden al crear el Blueprint (sync: false).

services:
  - type: web
    name: uber-ms-usuarios
    runtime: docker
    dockerfilePath: ./ms-usuarios/Dockerfile
    dockerContext: ./ms-usuarios
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: uber-usuarios-db
          property: connectionString
      - key: PORT
        value: "8081"

  - type: web
    name: uber-ms-viajes
    runtime: docker
    dockerfilePath: ./ms-viajes/Dockerfile
    dockerContext: ./ms-viajes
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: uber-viajes-db
          property: connectionString
      - key: PORT
        value: "8082"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: NOTIFICACIONES_URL
        value: "https://uber-ms-notificaciones.onrender.com"

  - type: web
    name: uber-ms-pagos
    runtime: docker
    dockerfilePath: ./ms-pagos/Dockerfile
    dockerContext: ./ms-pagos
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: uber-pagos-db
          property: connectionString
      - key: PORT
        value: "8083"
      - key: OPENAI_API_KEY
        sync: false
      - key: NOTIFICACIONES_URL
        value: "https://uber-ms-notificaciones.onrender.com"

  - type: web
    name: uber-ms-notificaciones
    runtime: docker
    dockerfilePath: ./ms-notificaciones/Dockerfile
    dockerContext: ./ms-notificaciones
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: uber-notificaciones-db
          property: connectionString
      - key: PORT
        value: "8084"
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: uber-usuarios-db
    plan: free
  - name: uber-viajes-db
    plan: free
  - name: uber-pagos-db
    plan: free
  - name: uber-notificaciones-db
    plan: free
