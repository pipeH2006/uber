# Render Blueprint: despliega los 4 microservicios + 1 base PostgreSQL COMPARTIDA.
#
# IMPORTANTE (límite del plan gratuito de Render):
#   - Render free solo permite UNA base PostgreSQL activa por workspace.
#   - Por eso los 4 microservicios comparten UNA sola base de datos aquí.
#   - No hay conflicto de tablas: cada microservicio usa nombres distintos
#     (usuarios, calificaciones, viajes, pagos, notificaciones, plantillas).
#
# En LOCAL (docker-compose.yml) sí se usan 4 bases separadas, una por servicio.

services:
  - type: web
    name: uber-ms-usuarios
    runtime: docker
    dockerfilePath: ./ms-usuarios/Dockerfile
    dockerContext: ./ms-usuarios
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: uber-db
          property: connectionString

  - type: web
    name: uber-ms-viajes
    runtime: docker
    dockerfilePath: ./ms-viajes/Dockerfile
    dockerContext: ./ms-viajes
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: uber-db
          property: connectionString
      - key: OSRM_BASE_URL
        value: "https://router.project-osrm.org"
      - key: NOTIFICACIONES_URL
        value: "https://uber-ms-notificaciones.onrender.com"

  - type: web
    name: uber-ms-pagos
    runtime: docker
    dockerfilePath: ./ms-pagos/Dockerfile
    dockerContext: ./ms-pagos
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: uber-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: NOTIFICACIONES_URL
        value: "https://uber-ms-notificaciones.onrender.com"

  - type: web
    name: uber-ms-notificaciones
    runtime: docker
    dockerfilePath: ./ms-notificaciones/Dockerfile
    dockerContext: ./ms-notificaciones
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: uber-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: uber-db
    plan: free
